# .github/merge-queue/path_to_queues.yml
#
# Federated merge-queue path-to-queue routing config (RFC 0001 §4.1, §4.8).
# Loaded by the handler and processor from the develop ref via the GitHub
# Contents API + yaml.safe_load — see rocm_mq.config.load_from_develop.
#
# This file is in SELF_BOOTSTRAP_PATHS (rocm_mq.config.SELF_BOOTSTRAP_PATHS).
# /merge on any PR whose changed-file set intersects this path is REJECTED
# by the handler with an explanatory comment; landing edits requires manual
# maintainer merge (RFC §8 self-bootstrap protection).
#
# Scope (RFC §4.1 v1): hipDNN core + four providers + integration-tests.
# Plus one synthetic `dogfood-canary` queue gated to `dogfood/**` paths so
# DOG-03's deterministic CI-fail signal exercises required-check semantics
# without polluting real-code routing. Phase 5 porting-prep STRIPS the
# dogfood-canary queue + the dogfood/ path entry + the dogfood-canary
# required_checks entry for the upstream-bound config (CONTEXT.md
# `<specifics>`).
#
# Required-check context names verified live against fork PR #21 head SHA
# 04070ca96b77e75d180f09dd673e4c343260a8c6 (plan 03-03 Task 2):
#   gh api repos/SamuelReeder/rocm-libraries/commits/<sha>/check-runs
#   → {"app": "github-actions", "name": "TheRock CI Summary", ...}
# matches `.github/workflows/therock-ci.yml` line 171 (`name: TheRock CI Summary`).
#
# Schema validation (graph closure of upstream/downstream queue membership,
# required-check format, queue-name lexical rules) is Phase 4
# (mq-config-validate.yml). This file is trusted-but-attested today: the
# develop branch is branch-protected, edits land via maintainer merge only.

queues:
  - hipdnn
  - miopen-provider
  - hipblaslt-provider
  - hip-kernel-provider
  - fusilli-provider
  - integration-tests
  # SYNTHETIC — Phase 5 porting-prep strips this for upstream (RFC §4.1 v1 scope is hipDNN ecosystem only)
  - dogfood-canary

paths:
  # hipDNN core change → blocks everything downstream (all five providers + integration-tests).
  - path: projects/hipdnn/
    queues:
      - hipdnn
      - miopen-provider
      - hipblaslt-provider
      - hip-kernel-provider
      - fusilli-provider
      - integration-tests

  # Each provider change only blocks its own queue (no cross-provider coupling).
  - path: dnn-providers/miopen-provider/
    queues: [miopen-provider]
  - path: dnn-providers/hipblaslt-provider/
    queues: [hipblaslt-provider]
  - path: dnn-providers/hip-kernel-provider/
    queues: [hip-kernel-provider]
  - path: dnn-providers/fusilli-provider/
    queues: [fusilli-provider]

  # integration-tests changes block every provider + integration-tests (RFC §4.2 asymmetric edge).
  - path: dnn-providers/integration-tests/
    queues:
      - miopen-provider
      - hipblaslt-provider
      - hip-kernel-provider
      - fusilli-provider
      - integration-tests

  # SYNTHETIC — Phase 5 porting-prep strips this for upstream.
  # Dedicated path for the DOG-03 dogfood canary; the canary workflow
  # (mq-dogfood-canary.yml, plan 03-09) triggers on `paths: ['dogfood/**']`
  # and reads the PR title for the literal `[dogfood-ci-fail]` to decide
  # exit 0 vs exit 1.
  - path: dogfood/
    queues: [dogfood-canary]

# `required_checks` section removed per 03-wr-09 design refactor: branch
# protection is now the single source of truth for which checks gate a
# merge. The queue no longer maintains a duplicate list. The executor
# reads the merge-API 405/422 response to translate protection-blocked
# merges into Eject actions with the GitHub-supplied check name.
#
# To configure required checks for this repo: Settings → Branches →
# Branch protection rules (or Settings → Rules → Rulesets for newer
# path-scoped configurations). Add the check name(s) to "Require
# status checks to pass before merging" on the develop branch.
