[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rocm_mq"
version = "0.1.0"
description = "Federated Merge Queue — pure decision layer (RFC 0001)"
requires-python = ">=3.11"
dependencies = [
    "githubkit>=0.15.5",
    "httpx>=0.27",
    "PyYAML>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "hypothesis>=6.152.7",
    "time-machine>=2.14",
    "syrupy>=4",
    "ruff>=0.15.13",
    "mypy>=2.1.0",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rocm_mq"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "C4"]
ignore = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = false

[[tool.mypy.overrides]]
module = [
    "rocm_mq.decision",
    "rocm_mq.state",
    "rocm_mq.pathmap",
    "rocm_mq._helpers",
    "rocm_mq.comment",
    "rocm_mq.summary",
]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = ["error"]
pythonpath = ["."]
